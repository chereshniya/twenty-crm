x-twenty-service: &twenty-service
  # Required: pin the tested Twenty image by immutable digest; `latest` is
  # intentionally not accepted. The declarative Gektar metadata is installed
  # separately with `yarn twenty ... apply` after the server is healthy.
  image: ${TWENTY_IMAGE:?Set TWENTY_IMAGE to registry/image@sha256:digest}
  restart: always
  environment: &twenty-environment
    PG_DATABASE_URL: ${PG_DATABASE_URL:?Set PG_DATABASE_URL}
    SERVER_URL: ${SERVER_URL:?Set SERVER_URL}
    REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
    STORAGE_TYPE: s3
    STORAGE_S3_REGION: ${STORAGE_S3_REGION:?Set STORAGE_S3_REGION}
    STORAGE_S3_NAME: ${STORAGE_S3_NAME:?Set STORAGE_S3_NAME}
    STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?Set STORAGE_S3_ENDPOINT}
    STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:?Set STORAGE_S3_ACCESS_KEY_ID}
    STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?Set STORAGE_S3_SECRET_ACCESS_KEY}
    STORAGE_S3_PRESIGNED_URL_ENABLED: ${STORAGE_S3_PRESIGNED_URL_ENABLED:-true}
    STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE:-}
    STORAGE_S3_PRESIGNED_URL_EXPIRES_IN: ${STORAGE_S3_PRESIGNED_URL_EXPIRES_IN:-900}

services:
  server:
    <<: *twenty-service
    ports:
      - "${TWENTY_PORT:-8082}:3000"
    environment:
      <<: *twenty-environment
      NODE_PORT: 3000
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *twenty-service
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy
